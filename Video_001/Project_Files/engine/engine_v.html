<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'PTR';src:local('Inter Display Black'),local('InterDisplay-Black');font-weight:900}
  @font-face{font-family:'PTR';src:local('Inter Display ExtraBold'),local('InterDisplay-ExtraBold');font-weight:800}
  @font-face{font-family:'PTR';src:local('Inter Display SemiBold'),local('InterDisplay-SemiBold');font-weight:600}
  @font-face{font-family:'PTR';src:local('Inter Display Medium'),local('InterDisplay-Medium');font-weight:500}
  html,body{margin:0;padding:0;background:#0B0B0C;overflow:hidden}
  #stage{width:1080px;height:1920px;display:block}
  text{font-family:'PTR',sans-serif}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-weight:700}
</style></head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ───────────────────────────── Palette & helpers ─────────────────────────────
const C = {carbon:'#0B0B0C', graphite:'#1C1F24', grid:'#16191E', steel:'#C9CDD2', dim:'#6E747C', white:'#F4F4F2', orange:'#FF5A1F', ember:'#7A2A0E'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));             // progress of t within [a,b]
const eo=x=>1-Math.pow(1-x,3);                       // ease-out cubic
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;    // ease-in-out
const ei=x=>x*x*x;
const lerp=(a,b,x)=>a+(b-a)*x;
const R=(n)=>Math.round(n*100)/100;
function T(x,y,s,{size=40,fill=C.white,w=800,anchor='start',op=1,ls=0,mono=false,caps=false}={}){
  if(op<=0.001) return '';
  if(size<60) size=Math.round(size*1.4);
  return `<text x="${R(x)}" y="${R(y)}" font-size="${size}" fill="${fill}" font-weight="${w}" text-anchor="${anchor}" opacity="${R(op)}"
    letter-spacing="${ls}" ${mono?'class="mono"':''}>${caps?String(s).toUpperCase():s}</text>`;
}
// stroked path drawn-on by progress p (uses normalised pathLength)
const D=(d,p,{stroke=C.steel,w=4,op=1,cap='round',fill='none',dash=null}={})=> p<=0?'' :
  `<path d="${d}" pathLength="1" stroke="${stroke}" stroke-width="${w}" fill="${fill}" opacity="${R(op)}" stroke-linecap="${cap}" stroke-linejoin="round"
    stroke-dasharray="${dash||'1 1'}" stroke-dashoffset="${dash?0:R(1-p)}"/>`;
const L=(x1,y1,x2,y2,p=1,o={})=>D(`M${x1} ${y1} L${lerp(x1,x2,1)} ${lerp(y1,y2,1)}`,p,o);
const rect=(x,y,w,h,{fill='none',stroke=C.steel,sw=4,op=1,rx=0}={})=>`<rect x="${R(x)}" y="${R(y)}" width="${R(w)}" height="${R(h)}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${R(op)}"/>`;
const cam=(content,s,cx=960,cy=540,dx=0,dy=0)=>`<g transform="translate(${R(cx+dx)} ${R(cy+dy)}) scale(${R(s*1000)/1000}) translate(${-cx} ${-cy})">${content}</g>`;
const fade=(content,op)=>op<=0.001?'':`<g opacity="${R(op)}">${content}</g>`;
const hatch=(x,y,w,h,col=C.steel,op=.35)=>`<g opacity="${op}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#hatch_${col==C.orange?'o':'s'})"/></g>`;
function arrowDown(x,y,len,col=C.orange,op=1,w=6){ if(op<=0)return ''; return `<g opacity="${R(op)}"><line x1="${x}" y1="${y}" x2="${x}" y2="${y+len}" stroke="${col}" stroke-width="${w}"/><path d="M${x-14} ${y+len-18} L${x} ${y+len+4} L${x+14} ${y+len-18}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linejoin="round"/></g>`;}
function nut(x,y,{col=C.steel,glow=0,op=1}={}){ // hex nut (side) + washer, top edge at y
  const g = glow>0?`<rect x="${x-50}" y="${y-6}" width="100" height="58" rx="8" fill="${C.orange}" opacity="${R(.25*glow)}" filter="url(#blur)"/>`:'';
  return `<g opacity="${R(op)}">${g}<rect x="${x-40}" y="${y}" width="80" height="11" fill="${col}"/><path d="M${x-28} ${y+11} h56 l8 18 l-8 18 h-56 l-8 -18 z" fill="${glow>.5?C.orange:col}"/></g>`;
}
function rod(x,y1,y2,{col=C.steel,w=12,p=1,op=1}={}){ if(p<=0)return ''; const y=lerp(y1,y2,p);
  return `<g opacity="${R(op)}"><rect x="${x-w/2}" y="${Math.min(y1,y)}" width="${w}" height="${Math.abs(y-y1)}" fill="${col}"/></g>`;}

// Rating Bar: value/rated in %, scale max; returns SVG at (x,y) width W
function ratingBar(x,y,W,{value=0,rated=100,max=160,label='RATED',unit='%',num=true,numSize=150,deficit=false,h=34,color=null,showTick=true,tickLabel=null}={}){
  const px=v=>clamp(v/max,0,1)*W; let s='';
  const over=value>rated;
  if(num) s+=T(x,y-40,`${Math.round(value)}${unit}`,{size:numSize,mono:true,fill:color||(over||deficit?C.orange:C.white)});
  s+=`<rect x="${x}" y="${y}" width="${W}" height="${h}" fill="${C.graphite}" stroke="#2a2e35" stroke-width="2"/>`;
  s+=`<rect x="${x}" y="${y}" width="${R(px(Math.min(value,rated)))}" height="${h}" fill="${color||C.steel}"/>`;
  if(over) s+=`<polygon points="${x+px(rated)},${y} ${x+px(value)},${y} ${x+px(value)-h*.5},${y+h} ${x+px(rated)},${y+h}" fill="${C.orange}"/>`;
  if(deficit && value<rated) s+=`<rect x="${x+px(value)}" y="${y}" width="${R(px(rated)-px(value))}" height="${h}" fill="url(#hatch_o)" opacity=".9"/>`;
  if(showTick){ s+=`<rect x="${x+px(rated)-2}" y="${y-h*.5}" width="4" height="${h*2}" fill="${C.white}"/>`;
    s+=T(x+px(rated),y+h+46,tickLabel??`${label} ${rated}${unit}`,{size:26,fill:C.steel,anchor:'middle',w:800,ls:2,caps:true}); }
  return s;
}
function chip(x,y,s,{col=C.orange,op=1,size=26}={}){ if(op<=0)return ''; const z=size*1.4; const w=s.length*z*.66+44;
  return `<g opacity="${R(op)}"><rect x="${x}" y="${y}" width="${R(w)}" height="${R(z*1.7)}" fill="none" stroke="${col}" stroke-width="3"/>${T(x+22,y+z*1.18,s,{size,fill:col,w:800,ls:2,caps:true})}</g>`;}
function kicker(s,op=1,y=150){ return ''; return T(160,y,s,{size:30,fill:C.steel,w:800,ls:6,caps:true,op}); }
function logo(x,y,s,op=1){ return `<g transform="translate(${x} ${y}) scale(${s/100})" opacity="${R(op)}">
  <path d="M22 22 H74 L66 30 H30 V66 L22 74 Z" fill="${C.steel}"/><path d="M78 26 V78 H26 L34 70 H70 V34 Z" fill="${C.steel}"/>
  <path d="M86 14 L20 82 L16 80 Z" fill="${C.orange}"/></g>`; }

// ─────────────── Shared "set": atrium elevation (consistent geometry) ───────────────
const A={roofY:170,x1:240,x2:1800,w4:{x:560,y:430,w:800},w3:{x:1420,y:545,w:300},w2:{x:560,y:650,w:800},floor:880,rods:[660,960,1260]};
function walkway(x,y,w,{p=1,op=1,col=C.steel,label=null,lop=1}={}){
  let s=D(`M${x} ${y} H${x+w} V${y+30} H${x} Z`,p,{w:4,stroke:col,op});
  if(p>.6) s+=hatch(x,y,w,30,col,.35*op*P(p,.6,1));
  if(label) s+=T(x+w+26,y+26,label,{size:28,fill:C.dim,w:800,op:op*lop,ls:2});
  return s;
}
function atrium({draw=1,rods=1,asBuilt=false,dim=1,labels=1,highlight=0,crowd=0,crowdT=0,drop=0,showFloor=1}={}){
  let s='';
  // roof truss
  const rp=P(draw,0,.35);
  s+=D(`M${A.x1} ${A.roofY} H${A.x2}`,rp,{w:6,op:dim});
  let tr=''; for(let x=A.x1;x<A.x2;x+=80){ tr+=`M${x} ${A.roofY} L${x+40} ${A.roofY-46} L${x+80} ${A.roofY} `; }
  s+=D(tr,rp,{w:2,op:.6*dim});
  s+=D(`M${A.x1} ${A.roofY-46} H${A.x2}`,rp,{w:3,op:.6*dim});
  // side walls & floor
  if(showFloor){ s+=D(`M${A.x1} ${A.roofY} V${A.floor} H${A.x2} V${A.roofY}`,P(draw,.1,.5),{w:3,op:.45*dim});
    s+=T(A.x1+24,A.floor-24,'LOBBY',{size:24,fill:C.dim,w:800,ls:4,op:labels*dim*P(draw,.5,.7)}); }
  // walkways (with optional drop for failure)
  const d4=drop>0?eio(P(drop,0,.45))*(A.w2.y-A.w4.y-30):0;
  const d2=drop>0?ei(P(drop,.4,1))*(A.floor-A.w2.y-34):0;
  const tilt=drop>0?eio(P(drop,.4,1))*3:0;
  const wp=P(draw,.3,.8);
  s+=`<g transform="translate(0 ${R(d4+d2)}) rotate(${R(tilt)} 960 ${A.w4.y})">`+walkway(A.w4.x,A.w4.y,A.w4.w,{p:wp,op:dim,label:labels?'4F':null,lop:labels})+`</g>`;
  s+=walkway(A.w3.x,A.w3.y,A.w3.w,{p:wp,op:.55*dim,label:labels?'3F':null,lop:labels});
  s+=`<g transform="translate(0 ${R(d2)}) rotate(${R(tilt*.6)} 960 ${A.w2.y})">`+walkway(A.w2.x,A.w2.y,A.w2.w,{p:wp,op:dim,label:labels?'2F':null,lop:labels})+`</g>`;
  // rods
  const rp2=P(draw,.55,1)*rods;
  for(const x of A.rods){
    if(drop<=0){
      s+=rod(x,A.roofY,A.w4.y,{w:6,p:rp2,op:dim});
      const lx=asBuilt?x+22:x; const col=asBuilt&&highlight?C.orange:C.steel;
      s+=rod(lx,A.w4.y+30,A.w2.y,{w:6,p:rp2,op:dim,col});
      if(!asBuilt) s+=rod(x,A.w4.y,A.w4.y+30,{w:6,p:rp2,op:dim});
    } else {
      s+=rod(x,A.roofY,A.w4.y-10,{w:6,op:dim*(1-P(drop,0,.2))+.0});
    }
    s+=rod(A.w3.x+60,A.roofY,A.w3.y,{w:5,p:rp2*(x==A.rods[0]?1:0),op:.55*dim});
    s+=rod(A.w3.x+240,A.roofY,A.w3.y,{w:5,p:rp2*(x==A.rods[0]?1:0),op:.55*dim});
  }
  // highlight ring at 4F connection
  if(highlight>0){ const hx=A.rods[0],hy=A.w4.y+15;
    s+=`<circle cx="${hx}" cy="${hy}" r="${R(lerp(140,58,eo(highlight)))}" fill="none" stroke="${C.orange}" stroke-width="5" opacity="${R(highlight)}"/>`; }
  // crowd: small evenly spaced figures (abstract, respectful)
  if(crowd>0){
    const rnd=mulberry(7); let dots='';
    const d4y=d4+d2, spots=[[A.floor,A.x1+60,A.x2-60,64,0],[A.w4.y,A.w4.x+30,A.w4.x+A.w4.w-30,22,d4y],[A.w2.y,A.w2.x+30,A.w2.x+A.w2.w-30,22,d2],[A.w3.y,A.w3.x+30,A.w3.x+A.w3.w-30,7,0]];
    for(const [yy,xa,xb,n,dy] of spots){ for(let i=0;i<n;i++){
      const x=lerp(xa,xb,(i+.5)/n)+(rnd()-.5)*((xb-xa)/n)*.6; const ph=rnd()*6.28; const ap=clamp(crowd*1.5-rnd()*.5); if(ap<=0) continue;
      const by=yy+dy-1+Math.sin(crowdT*1.6+ph)*1.2;
      dots+=`<g opacity="${R(.8*ap*dim)}"><circle cx="${R(x)}" cy="${R(by-22)}" r="5" fill="${C.white}"/><rect x="${R(x-4)}" y="${R(by-15)}" width="8" height="14" rx="3" fill="${C.white}"/></g>`; } }
    s+=dots;
  }
  return s;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

// ─────────────── Shared "set": connection detail (box beam section) ───────────────
// Box beam drawn in elevation-section: two C channels toe-to-toe, welds at seams.
function boxBeam(cx,cy,{p=1,slide=1,weld=1,op=1,split=0,col=C.steel}={}){
  const w=420,h=150,f=26; const off=(1-eo(slide))*260; let s='';
  const left=`M${cx-6} ${cy-h/2} H${cx-w/2} V${cy+h/2} H${cx-6} V${cy+h/2-f} H${cx-w/2+f} V${cy-h/2+f} H${cx-6} Z`;
  const right=`M${cx+6} ${cy-h/2} H${cx+w/2} V${cy+h/2} H${cx+6} V${cy+h/2-f} H${cx+w/2-f} V${cy-h/2+f} H${cx+6} Z`;
  s+=`<g transform="translate(${R(-off)} 0)" opacity="${R(op)}">${D(left,p,{w:4,stroke:col})}${p>.95?`<path d="${left}" fill="${col}" opacity=".18"/>`:''}</g>`;
  s+=`<g transform="translate(${R(off)} 0)" opacity="${R(op)}">${D(right,p,{w:4,stroke:col})}${p>.95?`<path d="${right}" fill="${col}" opacity=".18"/>`:''}</g>`;
  if(weld>0 && slide>=1){ const wc=split>0?C.orange:C.orange; const gap=split*22;
    s+=`<rect x="${cx-6-gap}" y="${cy-h/2}" width="12" height="${f}" fill="${wc}" opacity="${R(weld*op)}"/>`;
    s+=`<rect x="${cx-6-gap}" y="${cy+h/2-f}" width="${12+gap*2}" height="${f}" fill="${wc}" opacity="${R(weld*op*(1-split*.6))}"/>`; }
  return s;
}
function loadArrows(cx,y,n,op,t,col=C.orange){ if(op<=0)return ''; let s=''; for(let i=0;i<n;i++){ const x=cx+(i-(n-1)/2)*70; const yy=y+((t*60+i*17)%40);
  s+=arrowDown(x,yy,60,col,op*(.6+.4*Math.sin(t*3+i)),5);} return s; }

// ───────────────────────────── Scene library ─────────────────────────────
const S={};
S.chapter=(t,d,c,pr)=>{ const a=eo(P(t,0,.7)), o=1-P(t,d-.45,d);
  return fade(T(160,500,pr.num,{size:260,mono:true,fill:C.orange,op:a})+
    `<rect x="160" y="565" width="${R(eo(P(t,.15,1.1))*760)}" height="8" fill="${C.steel}"/>`+
    T(160,690,pr.title,{size:120,w:900,caps:true,ls:-2,op:eo(P(t,.25,.9))}),o); };

S.coldopen_rod=(t,d,c)=>{
  const cb=c('beam'),cl=c('bolt'),cw=c('weld'),cr=c('rated'),cm=c('margin');
  let s=kicker('Everything is built for a number',eo(P(t,.2,1.2)));
  // three icons appearing on word cues
  const ic=(x,lab,tc,draw)=>fade(draw+T(x,640,lab,{size:30,fill:C.steel,w:800,anchor:'middle',ls:4,caps:true}),eo(P(t,tc,tc+.5)));
  s+=ic(560,'Beam',cb,`<rect x="420" y="430" width="280" height="90" fill="url(#hatch_s)" stroke="${C.steel}" stroke-width="4"/>`);
  s+=ic(960,'Bolt',cl,`<rect x="948" y="380" width="24" height="170" fill="${C.steel}"/><path d="M920 380 h80 l12 22 l-12 22 h-80 l-12 -22 z" fill="${C.steel}"/>`);
  s+=ic(1360,'Weld',cw,`<rect x="1230" y="440" width="120" height="70" fill="none" stroke="${C.steel}" stroke-width="4"/><rect x="1370" y="440" width="120" height="70" fill="none" stroke="${C.steel}" stroke-width="4"/><rect x="1350" y="440" width="20" height="70" fill="${C.orange}"/>`);
  // rating bar with margin
  const bp=eo(P(t,0,cr+1.0));
  s+=fade(ratingBar(460,860,1000,{value:100*bp,rated:100,max:160,num:true,numSize:120,label:'RATED'})+
    (cm>0?fade(hatch(460+1000*100/160,810,1000*60/160,34,C.steel,.5)+T(460+1000*130/160,840,'MARGIN',{size:26,fill:C.steel,anchor:'middle',w:800,ls:4}),eo(P(t,cm,cm+.6))):''),1);
  return cam(s,1+.03*t/d);
};
S.coldopen_date=(t,d,c)=>{
  const ck=c('connection'),cn=c('never'),cd=c('doubled');
  let s=atrium({draw:eo(P(t,0,3)),dim:.55,labels:0,highlight:P(t,ck,ck+.8)});
  s+=T(160,150,'KANSAS CITY',{size:30,fill:C.steel,w:800,ls:6,op:eo(P(t,.2,1))});
  s+=T(160,214,'JULY 1981',{size:64,w:900,op:eo(P(t,.4,1.3))});
  s+=chip(160,950,'Below code',{op:eo(P(t,cn,cn+.5))});
  s+=fade(T(1500,1000,'2×',{size:170,mono:true,fill:C.orange,anchor:'middle'}),eo(P(t,cd,cd+.4)));
  return cam(s,1+.05*eio(t/d),660,445);
};
S.coldopen_limit=(t,d,c)=>{
  const cl=c('limit'), hit=P(t,cl-.2,cl+.15), blk=P(t,cl+.9,cl+1.3);
  const shake=hit>=1&&blk<1?Math.sin(t*90)*6*(1-P(t,cl+.15,cl+.8)):0;
  let s=fade(`<g transform="translate(${R(shake)} 0)">`+ratingBar(360,600,1200,{value:lerp(70,100,eo(P(t,0,cl-.2)))+(hit>=1?2:0),rated:100,max:110,numSize:220,color:hit>=1?C.orange:null,label:'LIMIT'})+`</g>`,1-blk);
  // title card after the cut
  const tt=t-(cl+1.6);
  if(tt>0){ s+=fade(logo(890,300,140,1)+T(960,560,'PAST THE RATING',{size:34,fill:C.steel,anchor:'middle',w:800,ls:10})+
    T(960,680,'The Drawing Change',{size:84,w:900,anchor:'middle',caps:true,op:eo(P(tt,.3,1))})+
    T(960,780,'That Doubled the Load',{size:84,w:900,anchor:'middle',caps:true,fill:C.orange,op:eo(P(tt,.6,1.3))}),eo(P(tt,0,.6))*(1-P(t,d-.5,d))); }
  return s;
};
S.atrium_build=(t,d,c)=>{
  const c4=c('second'),c3=c('third');
  let s=atrium({draw:eo(P(t,.3,9)),labels:1});
  s+=T(160,1010,'HYATT REGENCY KANSAS CITY · OPENED JULY 1980',{size:26,fill:C.dim,w:800,ls:4,op:eo(P(t,.5,1.5))});
  s+=fade(`<rect x="${A.w4.x-14}" y="${A.w4.y-14}" width="${A.w4.w+28}" height="${A.w2.y-A.w4.y+58}" fill="none" stroke="${C.orange}" stroke-width="3" stroke-dasharray="14 10"/>`+
    T(A.w4.x-30,A.w4.y+120,'STACKED',{size:24,fill:C.orange,anchor:'end',w:800,ls:4}),eo(P(t,c4,c4+.6))*(1-P(t,c3,c3+.5)*.6));
  s+=fade(`<rect x="${A.w3.x-14}" y="${A.w3.y-14}" width="${A.w3.w+28}" height="58" fill="none" stroke="${C.steel}" stroke-width="3" stroke-dasharray="14 10"/>`,eo(P(t,c3,c3+.6)));
  return cam(s,lerp(1.0,1.06,eio(t/d)),960,520);
};
S.atrium_rods=(t,d,c)=>{
  const cr=c('rods'),cl=c('look');
  let s=atrium({labels:1});
  // glow the rods
  for(const x of A.rods) s+=fade(`<rect x="${x-5}" y="${A.roofY}" width="10" height="${A.w2.y-A.roofY}" fill="${C.orange}" opacity=".85"/>`,eo(P(t,cr,cr+.6))*(1-P(t,cl-.5,cl)));
  s+=fade(T(1700,320,'SLENDER STEEL RODS',{size:26,fill:C.orange,anchor:'end',w:800,ls:4}),eo(P(t,cr,cr+.6))*(1-P(t,cl-.5,cl)));
  s+=fade(`<line x1="960" y1="${A.w4.y-30}" x2="960" y2="${A.floor-30}" stroke="${C.white}" stroke-width="2" stroke-dasharray="6 10"/>`+T(990,760,'≈ 4 STOREYS OF AIR',{size:24,fill:C.steel,w:800,ls:4}),eo(P(t,cl,cl+.6)));
  return cam(s,lerp(1.06,1.18,eio(t/d)),960,420);
};
S.atrium_crowd=(t,d,c)=>{
  const cs=c('sixteen'),cd=c('dozens');
  let s=atrium({labels:0,crowd:eo(P(t,cs-.6,cs+2.5)),crowdT:t});
  s+=T(160,150,'FRIDAY TEA DANCE',{size:30,fill:C.steel,w:800,ls:6,op:eo(P(t,.2,1))});
  s+=fade(T(160,250,`≈ ${Math.round(1600*eo(P(t,cs-.2,cs+1.6))).toLocaleString('en-US')}`,{size:110,mono:true})+T(160,300,'PEOPLE IN THE ATRIUM',{size:24,fill:C.dim,w:800,ls:4}),eo(P(t,cs-.3,cs+.2)));
  s+=fade(`<rect x="${A.w4.x-14}" y="${A.w4.y-40}" width="${A.w4.w+28}" height="78" fill="none" stroke="${C.orange}" stroke-width="3" stroke-dasharray="14 10"/><rect x="${A.w2.x-14}" y="${A.w2.y-40}" width="${A.w2.w+28}" height="78" fill="none" stroke="${C.orange}" stroke-width="3" stroke-dasharray="14 10"/>`,eo(P(t,cd,cd+.6)));
  return cam(s,lerp(1.0,1.05,eio(t/d)),960,560);
};
S.joint_zoom=(t,d,c)=>{
  const z=eio(P(t,.2,d-.2));
  let s=atrium({labels:0,highlight:P(t,.2,1.2)});
  return cam(s,lerp(1,4.2,z),A.rods[0],A.w4.y+15,lerp(0,960-A.rods[0],z),lerp(0,540-A.w4.y-15,z));
};
S.boxbeam_exploded=(t,d,c)=>{

// elevation section of one hanger line: roof → 4F box → 2F box
function hangerSection({mode='original',p=1,glow4=0,glow2=0,labels={},flow=0,t=0,ox=0}={}){
  const x=960+ox, yR=100, y4=430, y2=820; let s='';
  s+=`<rect x="${x-300}" y="${yR-40}" width="600" height="40" fill="url(#hatch_s)" stroke="${C.steel}" stroke-width="3"/>`;
  s+=T(x+320,yR-8,'ROOF',{size:22,fill:C.dim,w:800,ls:4});
  const bb=(y)=>`<rect x="${x-110}" y="${y-38}" width="220" height="76" fill="url(#hatch_s)" stroke="${C.steel}" stroke-width="4"/>`;
  s+=bb(y4)+T(x+130,y4+10,'4F BOX BEAM',{size:22,fill:C.dim,w:800,ls:3})+bb(y2)+T(x+130,y2+10,'2F BOX BEAM',{size:22,fill:C.dim,w:800,ls:3});
  if(mode=='original'){
    s+=rod(x,yR,lerp(yR,y2+60,p),{w:12});
    s+=nut(x,y4+38,{glow:glow4})+nut(x,y2+38,{glow:glow2});
  } else {
    const sp=p; s+=rod(x-22,yR,lerp(yR,y4+60,sp),{w:12});
    s+=nut(x-22,y4+38,{glow:glow4});
    s+=rod(x+22,y4-60,lerp(y4-60,y2+60,sp),{w:12,col:mode=='asbuilt_hl'?C.orange:C.steel});
    s+=`<rect x="${x+22-30}" y="${y4-38-26}" width="60" height="26" fill="${C.steel}"/>`; // nut on top flange
    s+=nut(x+22,y2+38,{glow:glow2});
  }
  if(flow>0){ // load chevrons travelling up from 2F to 4F connection
    for(let i=0;i<6;i++){ const ph=((t*.55+i/6)%1); const yy=lerp(y2-10,y4+40,ph); const xx=mode=='original'?x:x+22;
      s+=`<path d="M${xx-16} ${yy+10} L${xx} ${yy-8} L${xx+16} ${yy+10}" stroke="${C.orange}" stroke-width="5" fill="none" opacity="${R(flow*Math.sin(ph*Math.PI))}"/>`; } }
  for(const [k,v] of Object.entries(labels)) if(v.op>0) s+=T(v.x+ox,v.y,v.s,{size:v.size||26,fill:v.col||C.steel,w:800,ls:3,op:v.op,anchor:v.a||'start'});
  return s;
}
